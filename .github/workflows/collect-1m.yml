name: Collect 1m Candles

# روی GitHub نمی‌توان --loop دائمی داشت؛ هر چند دقیقه یک سیکل incremental
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Incremental 1m sync (one cycle)
        env:
          CANDLE_DB_PATH: market_data.db
        run: python collect_1m_data.py --days 10

      - name: Commit market_data.db
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Collector: incremental 1m OHLCV update"
          file_pattern: "market_data.db"
          skip_dirty_check: false
          skip_fetch: false

name: Collect 1m Candles v11.3.0
# KhosroSignalAnalyzerBot v11.3.0

# سیکل incremental برای حفظ پیوستگی کندل‌های ۱ دقیقه‌ای بین اجراهای signal-bot.
# v11.3: با گروه concurrency از تداخل کامیت با signal-bot جلوگیری می‌شود
# و retention دیتابیس ۱۲ روز + VACUUM است (سقف امن زیر ۱۰۰MB گیت‌هاب).
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

concurrency:
  group: khosro-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Incremental 1m sync (one cycle, 12d retention + VACUUM + size guard)
        env:
          CANDLE_DB_PATH: market_data.db
        run: python collect_1m_data.py --days 12

      - name: Commit market_data.db
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Collector: incremental 1m OHLCV update (v11.3.0)"
          file_pattern: "market_data.db"
          skip_dirty_check: false
          skip_fetch: false

name: Nightly cleanup

# شب تهران: prune دیتابیس + اطمینان از resolve شدن OPENها
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve OPEN + light 1m sync via bot entry
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDLE_DB_PATH: market_data.db
        run: python monitor_nightly.py

      - name: Prune signals older than 90 days
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          d = "signals"
          if not os.path.isdir(d):
              raise SystemExit(0)
          now = datetime.now(ZoneInfo("Asia/Tehran")).date()
          deleted = 0
          for name in os.listdir(d):
              if not name.endswith(".csv"):
                  continue
              try:
                  file_date = datetime.strptime(name.replace(".csv", ""), "%Y-%m-%d").date()
              except ValueError:
                  continue
              if (now - file_date).days > 90:
                  os.remove(os.path.join(d, name))
                  deleted += 1
                  print("deleted", name)
          print("deleted_count", deleted)
          PY

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Nightly: resolve OPEN, prune 90d signals and 1m cache"
          file_pattern: "signals/*.csv market_data.db"
          skip_dirty_check: false
          skip_fetch: false

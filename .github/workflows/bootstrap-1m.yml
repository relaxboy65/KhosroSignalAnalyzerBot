name: Bootstrap 1m DB v11.3.0 (one-time)
# KhosroSignalAnalyzerBot v11.3.0

# فقط یک‌بار (یا بعد از ریست): پاک کردن DB قبلی و پر کردن پنجره retention.
# v11.3: پنجره ۱۲ روز است (حدود ۴۵MB) — بک‌فیل ۹۰ روزه قدیمی دیتابیس را
# از سقف ۱۰۰MB کامیت گیت‌هاب رد می‌کرد و حذف شد.
on:
  workflow_dispatch:

concurrency:
  group: khosro-state
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wipe + backfill 12-day 1m window
        env:
          CANDLE_DB_PATH: market_data.db
        run: python collect_1m_data.py --force --days 12

      - name: Show DB size
        run: ls -lh market_data.db && python -c "from candle_store import database_stats, db_file_size_mb; print(database_stats(), round(db_file_size_mb(),1), 'MB')"

      - name: Commit market_data.db
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bootstrap: 12d 1m OHLCV in market_data.db (v11.3.0)"
          file_pattern: "market_data.db"
          skip_dirty_check: false
          skip_fetch: false
